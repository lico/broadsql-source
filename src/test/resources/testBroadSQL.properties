;BroadSQL ini file
; See following URL about INI file format:
; http://commons.apache.org/configuration/apidocs/org/apache/commons/configuration/HierarchicalINIConfiguration.html
;
; List delimiter for multiple values is the pipe (|) and not the comma.

[General]
;Default Prompt
prompt.text=BroadSQL>
; Name of the file that contains the servers list
;ServersFileName=mem:broadSqlTest
ServersFileName=
; Type of the Servers Definition File
ServersFileType=H2
; Default folder for extractions
DefaultFolder=c:\\temp\\
; Default file name of extracted files
DefaultExtFileName=results.xlsx
; Folder for temporary files
TemporaryFolder=c:\\temp\\
; JAR file name and Package name for custom commands/extension
CustomExtensionsFolder=
CustomExtensionsPackage=
; Default column separator
FieldsSeparator=\t
; Screen separator
ScreenSeparator=|
; Max number of rows to display on a screen query (to avoid blocking the app)
MaxRowsOnScreen=100
; Autocommit mode: false or true (if autocommit not in INI file, this creates an error. default autocommit=false)
Autocommit=false
; Max number of row for dump to an XLXS file. If bigger, dumps to a text file
MaxRowXLSX=500000
; SQL Queries Library: contains SQL queries
SqlLib=C:\\BroadSQL\\sqllib\\
; Win Edit Plus
WinEditPlus=

[Log]
IsLogActivated=FALSE
LogFolderName=C:\\BroadSQL\\logs 
LogFileNamePattern=CONSOLE

