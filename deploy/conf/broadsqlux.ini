;
; BroadSQL ini file for Linux/macOS
;   . List delimiter for multiple values is the pipe (|) and not the comma.
;   . An invalid or missing optional setting below never prevents BroadSQL from starting: BroadSQL
;     reports the problem once at startup and falls back to the documented default shown next to each
;     setting; only functionality that genuinely needs that setting is affected.
;

[General]
; Name of the file that contains the servers list
ServersFileName=file:./conf/ConnectionsDefinitionFile.cdf
; Default file name of extracted files
DefaultExtFileName=results.xlsx
; Default folder for extractions
DefaultFolder=/home/myuser/broadsql/temp
; Folder scanned at startup for JAR files containing custom commands (extensions). A relative path is
; relative to the BroadSQL installation folder, where the launchers start BroadSQL. The launchers put
; extensions/* on the Java classpath: keep extensions unless you also change the launcher. Empty: no
; folder is scanned and no custom command is registered.
CustomExtensionsFolder=extensions
; Default columns separator in export files. A single character. If missing or not exactly one
; character, defaults to \t (tab).
FieldsSeparator=\t
; Screen columns separator of query results (for space sign use the following value \u0020): it separates
; the columns and starts and ends every line of the table. A single character. If missing or not exactly
; one character, defaults to | (pipe).
ScreenSeparator=|
; Max number of rows to display on a screen query, to avoid blocking the app (0 = display all). A
; non-negative integer. If missing or invalid, defaults to 100.
MaxRowsOnScreen=100
; Row-count threshold of DUMP <table> alone (no TO/AS): at or below it, the file is written in the
; DefaultFileFormat below; above it, a tab-separated text file is written instead. A positive integer.
; If missing, defaults to 500000; if present but invalid (e.g. not a number), DUMP <table> alone refuses
; to run until this is corrected (a startup warning identifies the problem), and unrelated SQL and
; commands keep working normally.
MaxRowXLSX=500000
; Default export format, used by DUMP and PULL when AS <format> is omitted: XLSX, ODS, CSV or TXT (TXT is
; the TEXT format; not case-sensitive). If missing, defaults to ODS. If invalid, DUMP <table> alone uses
; ODS and the other forms without AS <format> report a configuration error.
DefaultFileFormat=ODS
; Field separator of the CSV export format (DUMP ... AS CSV) and of the CSV files read by LOAD: COMMA or
; SEMICOLON (not case-sensitive).
; No other separator is supported; TEXT is always tab separated and JSON has none. If missing, defaults
; to SEMICOLON.
CsvSeparator=SEMICOLON
; Recognized and validated at startup (free text, e.g. DEV, QA), but currently has no effect on any
; command: the H2 connections DUMP ... AS H2 creates are registered in the built-in LOCAL environment,
; whatever this value. If missing, defaults to DEV.
DefaultEnvironment=DEV
; Autocommit mode: true or false. If missing or invalid (not exactly true/false), defaults to false.
Autocommit=false
; Scripts Library: the folder of reusable Scripts (text files of SQL and/or BroadSQL commands), run with
; @name or LIB RUN name (path can be relative or absolute). If missing, defaults to scripts.
; The former SqlLib, Scripts and ListSubfolders settings are obsolete and ignored.
ScriptsLibrary=scripts
; Scripts folder for the experimental JS * commands: contains .js scripts (path can be relative or absolute).
; JavaScript is not part of the Scripts Library.
JsScripts=jsscripts
; Read at startup but not currently used: EDIT opens the BroadSQL Editor whatever this value. Leave blank.
WinEditPlus=
; JLine interactive console (Esc to cancel input, Up/Down and Ctrl-R history, TAB completion, line
; editing shortcuts) - ON or OFF, not case-sensitive. ON is the default, and applies if this key is
; missing. OFF explicitly selects the basic operating-system console instead. Never changes command
; semantics: every command behaves identically whether ON or OFF.
activatejline=ON
; Where JLine's persistent command history is stored across sessions (Up/Down, Ctrl-R) - deliberately
; per OS user, never install-relative, since history is personal, session-continuity data that a
; shared install must not mix or leak between different OS users. Blank/absent (default): stores at
; $HOME/.broadsql/history. An absolute path here is used exactly as given; a relative path (e.g.
; jlinehistoryfile=myhistory) resolves under that same per-user .broadsql directory, never against this
; install or its conf folder. If the location cannot be created or written, BroadSQL falls back to
; in-memory-only history for that session rather than failing to start.
jlinehistoryfile=
; Terminal colors (theme, syntax highlighting, colored messages and prompt). AUTO (default): only when
; the terminal reports color support, never when output is redirected or activatejline=OFF. ON: always.
; OFF: never. Not case-sensitive.
color=AUTO
; Color theme: default-dark (default), default-light, classic, high-contrast-dark, high-contrast-light,
; mono (no colors, bold/underline only) or none (BroadSQL's appearance before themes: no highlighting,
; no colored prompt or messages). Not case-sensitive.
theme=default-dark
; Layout of result tables for the terminal width: AUTO (default: COMPACT below 80 columns, WIDE from 160,
; NORMAL in between), COMPACT (narrow columns, long values shortened on screen, rows shown vertically when
; the table cannot fit), NORMAL (the established layout) or WIDE (extra spacing). Display only: data,
; exports and captured results are never shortened. Not case-sensitive.
displaymode=AUTO
; Where the Script Library's filesystem revision vault (version history for edited Scripts) stores its
; index and per-asset revisions - same per-OS-user, never install-relative convention as
; jlinehistoryfile above. Blank/absent (default): stores at $HOME/.broadsql/script-history. An absolute
; path is used as given; a relative path resolves under that same per-user .broadsql directory.
; Uncomment and set only if you need the revision vault somewhere other than the default location.
;scripthistoryvault=
; Enterprise HTTP/HTTPS proxy for API execution (RUN/CONFIG API) only - never affects any other
; BroadSQL networking. NONE (default): no proxy. SYSTEM: use the operating system's own proxy
; settings (JVM system proxy discovery) - no host/port needed below. MANUAL: use the explicit
; apiproxyhost/apiproxyport (and optional apiproxytype/apiproxynonproxyhosts/credentials) below.
apiproxymode=NONE
; MANUAL mode only, below this point.
; HTTP (default) or SOCKS.
apiproxytype=HTTP
apiproxyhost=
apiproxyport=
; Pipe-separated hosts that bypass the MANUAL proxy - * is a wildcard, e.g. localhost|127.*|*.corp.local
apiproxynonproxyhosts=
; Optional MANUAL proxy authentication. An environment-variable reference is strongly preferred over
; a literal value - use ${ENV:NAME} (BroadSQL's own environment-variable syntax), e.g.
; apiproxyusername=${ENV:BROADSQL_PROXY_USER}
apiproxyusername=
apiproxypassword=

[Log]
; Whether BroadSQL logs session activity to a file by default. true or false. If missing or invalid,
; defaults to false. TRUE on this Linux template (FALSE on Windows): Linux installs are more often run
; unattended, where a log file from the first run is useful.
IsLogActivated=TRUE
; Folder of the activity log files: logs, the logs folder of the installation (a relative path is
; relative to the installation folder).
LogFolderName=logs
LogFileNamePattern=CONSOLE

